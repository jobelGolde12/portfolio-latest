<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect x="40" y="40" width="1120" height="595" rx="8" fill="#111111" stroke="#222222" stroke-width="1"/>
  
  <!-- Title area -->
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="300" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Convert</text>
  <text x="600" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Browser-first document conversion, privately</text>
  
  <!-- Document icons row -->
  <g transform="translate(200, 220)">
    <!-- Word doc -->
    <rect x="0" y="0" width="120" height="150" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="20" y="25" width="80" height="8" rx="2" fill="#2563eb"/>
    <rect x="20" y="45" width="60" height="6" rx="2" fill="#333"/>
    <rect x="20" y="58" width="70" height="6" rx="2" fill="#333"/>
    <rect x="20" y="71" width="50" height="6" rx="2" fill="#333"/>
    <text x="60" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Word</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(370, 280)">
    <path d="M0 0 L40 0 M30 -10 L40 0 L30 10" stroke="#444" stroke-width="2" fill="none"/>
  </g>
  
  <!-- PDF doc -->
  <g transform="translate(450, 220)">
    <rect x="0" y="0" width="120" height="150" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="20" y="25" width="80" height="8" rx="2" fill="#dc2626"/>
    <rect x="20" y="45" width="60" height="6" rx="2" fill="#333"/>
    <rect x="20" y="58" width="70" height="6" rx="2" fill="#333"/>
    <rect x="20" y="71" width="50" height="6" rx="2" fill="#333"/>
    <text x="60" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">PDF</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(620, 280)">
    <path d="M0 0 L40 0 M30 -10 L40 0 L30 10" stroke="#444" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Excel doc -->
  <g transform="translate(700, 220)">
    <rect x="0" y="0" width="120" height="150" rx="6" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <rect x="20" y="25" width="80" height="8" rx="2" fill="#16a34a"/>
    <rect x="20" y="45" width="60" height="6" rx="2" fill="#333"/>
    <rect x="20" y="58" width="70" height="6" rx="2" fill="#333"/>
    <rect x="20" y="71" width="50" height="6" rx="2" fill="#333"/>
    <text x="60" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Excel</text>
  </g>
  
  <!-- Feature pills -->
  <g transform="translate(600, 450)">
    <rect x="-280" y="0" width="120" height="32" rx="16" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="-220" y="21" font-family="system-ui, sans-serif" font-size="11" fill="#888" text-anchor="middle">31 formats</text>
    
    <rect x="-130" y="0" width="120" height="32" rx="16" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="-70" y="21" font-family="system-ui, sans-serif" font-size="11" fill="#888" text-anchor="middle">Privacy-first</text>
    
    <rect x="20" y="0" width="120" height="32" rx="16" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="80" y="21" font-family="system-ui, sans-serif" font-size="11" fill="#888" text-anchor="middle">No account</text>
    
    <rect x="170" y="0" width="120" height="32" rx="16" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="230" y="21" font-family="system-ui, sans-serif" font-size="11" fill="#888" text-anchor="middle">Auto-delete</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="60" y="595" width="1080" height="1" fill="#222"/>
</svg>